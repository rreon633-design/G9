name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p g9-core -p g9-iptv -p g9-store --all-targets -- -D warnings
      - name: Test
        run: cargo test -p g9-core -p g9-iptv -p g9-store

  frontend:
    name: Frontend static check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require vanilla UI
        run: |
          test -f ui/index.html
          test -f ui/styles.css
          test -f ui/app.js
          test -f ui/gif.js
          test ! -e ui/main.ts
          test ! -e ui/package.json
          echo "vanilla UI ok"
