name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    name: Windows x64 optimized
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2

      - name: Install CLI
        run: npm ci

      - name: Test (release)
        run: cargo test --workspace --release

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: G9 ${{ github.ref_name }} — Windows
          releaseBody: |
            **Windows 10 / 11 64-bit (x64)** — optimized, stripped, LTO release.

            | File | What |
            |---|---|
            | `G9_*_x64-setup.exe` | NSIS installer (recommended, per-user, no admin) |
            | `G9_*.msi` | MSI |
            | `G9-*-windows-x64-portable.zip` | Portable `G9.exe` |

            G9 is a player. It ships **no channels**. Add your own legal sources.

            WebView2 Runtime is downloaded automatically if this PC does not already have it (standard on Windows 11).
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: --target x86_64-pc-windows-msvc --bundles nsis,msi

      - name: Portable zip
        shell: pwsh
        run: |
          $candidates = @(
            "target/x86_64-pc-windows-msvc/release/g9.exe",
            "src-tauri/target/x86_64-pc-windows-msvc/release/g9.exe",
            "target/release/g9.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { Get-ChildItem -Recurse -Filter g9.exe | Select-Object -ExpandProperty FullName; throw "g9.exe not found" }
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item $exe portable/G9.exe
          $zip = "G9-${{ github.ref_name }}-windows-x64-portable.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path portable/G9.exe -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Format-List FullName, Length

      - name: Attach portable zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: G9-${{ github.ref_name }}-windows-x64-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
