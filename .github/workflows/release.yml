name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Required so GITHUB_TOKEN can create a GitHub Release.
# Repo setting must allow it: Settings → Actions → General → Workflow permissions
# → "Read and write permissions".
permissions:
  contents: write
  actions: write
  attestations: write
  id-token: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    name: Windows x64 optimized
    runs-on: windows-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2

      - name: Install CLI
        run: npm ci

      - name: Test crates (release)
        run: cargo test -p g9-core -p g9-iptv -p g9-store --release

      - name: Build Windows installers
        shell: pwsh
        run: |
          npx tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Surface build errors as annotations
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            $bad = Select-String -Path build.log -Pattern 'error(\[E\d+\])?:|Error:|failed to' | Select-Object -First 15
            foreach ($m in $bad) {
              $msg = ($m.Line.Trim() -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')
              if ($msg.Length -gt 900) { $msg = $msg.Substring(0,900) }
              Write-Output "::error title=Windows build::$msg"
            }
            Get-Content build.log -Tail 60
          }

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-win | Out-Null
          Get-ChildItem -Recurse -Include *.msi,*.exe | Where-Object {
            $_.FullName -match 'bundle' -or $_.Name -match 'setup'
          } | ForEach-Object { Copy-Item $_.FullName dist-win/ -Force; $_.FullName }
          $exe = @(
            "target/x86_64-pc-windows-msvc/release/g9.exe",
            "src-tauri/target/x86_64-pc-windows-msvc/release/g9.exe",
            "target/release/g9.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($exe) {
            New-Item -ItemType Directory -Force -Path portable | Out-Null
            Copy-Item $exe portable/G9.exe
            Compress-Archive -Path portable/G9.exe -DestinationPath dist-win/G9-windows-x64-portable.zip -Force
          }
          Get-ChildItem dist-win | Format-Table Name, Length
          if (-not (Get-ChildItem dist-win)) { throw "no Windows artifacts" }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: G9-windows-x64
          path: dist-win/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.6.0' }}
          name: G9 ${{ github.ref_type == 'tag' && github.ref_name || 'v0.6.0' }} — Windows
          draft: false
          prerelease: false
          generate_release_notes: false
          files: dist-win/*
          body: |
            **Windows 10 / 11 64-bit (x64)** — optimized (LTO, stripped).

            | File | What |
            |---|---|
            | `*-setup.exe` | NSIS installer (per-user, LZMA, no admin) |
            | `*.msi` | MSI |
            | `G9-windows-x64-portable.zip` | Portable `G9.exe` |

            **v0.6.0**
            - Downloads work again: G9 now installs its FFmpeg engine on first use, because YouTube only publishes separate video and audio streams. Failed downloads also say why, and can be retried
            - TV Mode is a channel browser: logo grid, search, Country / Language / Quality chips and sorting, with now/next on every card
            - TV Mode tunes a channel by itself (the last one you watched), and a Channels pill brings the browser back while you watch
            - Channel lists keep tvg-country, tvg-language and 4K/FHD/HD/SD, so the filters are real
            - Everything from 0.5: yt-dlp downloads, pause/resume, notifications, XMLTV guides, Xtream Codes

            Full list: [FEATURE-LIST.md](https://github.com/rreon633-design/G9/blob/main/FEATURE-LIST.md)

            G9 is a player. It ships **no channels**. Add your own legal sources.

            WebView2 is downloaded automatically if missing (already present on Windows 11).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
