[workspace]
resolver = "2"
members = ["src-tauri", "crates/g9-core", "crates/g9-iptv", "crates/g9-store"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
authors = ["G9 contributors"]
repository = "https://github.com/g9-player/g9"
rust-version = "1.77"

[workspace.dependencies]
g9-core = { path = "crates/g9-core" }
g9-iptv = { path = "crates/g9-iptv" }
g9-store = { path = "crates/g9-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
url = "2"

# Fast, small Windows (and any) release binaries.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
incremental = false
panic = "abort"
debug = false
